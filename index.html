<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Открий своя профил</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#0057b8,#00a3ff);
    margin:0;
    min-height:100vh;
}

.wrapper{
	display:flex;
    color:#333;
}

.align{
    justify-content:center;
    align-items:center;
}

#logo{
	max-width:100px;
	width:8%;
	min-width:80px;
}
#logo img{
	width:100%;
	height:auto;
}
.header{
	padding:1%;
	margin-bottom:2%;
	background-color:#fff;
	font-size: clamp(16px, 1.5vw, 32px);
	text-align:center;
	justify-content: space-evenly;
}
.header a{
	text-decoration:none;
	color:#0057b8;
}
.container{
    width:90%;
    max-width:700px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}

h1, h2{
    color:#0057b8;
}

.progress{
    height:12px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin:20px 0;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#0057b8;
    transition:0.3s;
}

.question{
    font-size:1.4em;
    margin:30px 0;
}

.btn{
    display:block;
    width:100%;
    margin:12px 0;
    padding:18px;
    font-size:1.1em;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
}

.btn:hover{
    transform:scale(1.02);
}

.tech{
    background:#e3f2fd;
}

.biz{
    background:#fff3cd;
}

.result{
    display:none;
}

.badge{
    font-size:4em;
    animation:pulse 1s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.1);}
}

.percent{
    font-size:2em;
    color:#0057b8;
    font-weight:bold;
}

.qr{
    margin-top:20px;
}

.restart{
    background:#0057b8;
    color:white;
}
</style>
</head>
<body>
	<header class="header wrapper align" >
		<div id="logo">
			<a href="https://39su.eu/" title="39. СУ Петър Динеков">
				<img src="Logo-39-FINAL.svg" />
			</a>
		</div>
		<h1><a href="https://39su.eu/" title="39. СУ Петър Динеков">39. СУ "Петър Динеков"</a></h1>
	</header>
		<div class="wrapper align">
			<div class="container">

			<div id="quiz">

			<h2>Какъв искаш да станеш:<br>програмист или предприемач?</h2>

			<div class="progress">
				<div class="progress-bar" id="bar"></div>
			</div>

			<div class="question" id="question"></div>

			<button class="btn tech" id="aBtn"></button>
			<button class="btn biz" id="bBtn"></button>

			</div>

			<div id="result" class="result">

			<div class="badge" id="badge"></div>

			<h1 id="profileName"></h1>

			<div class="percent" id="percent"></div>

			<p id="description"></p>

			<div class="qr">
				<p><strong>Научи повече в <a href="https://39su.eu/" title="39. СУ Петър Динеков">сайта на 39. СУ "Петър Динеков"</a></strong></p>

				<img
				  src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://39su.eu/"
				  alt="QR Code">
			</div>

			<br>

			<button class="btn restart" onclick="location.reload()">
			Реши отново
			</button>

			</div>

			</div>
		</div>

	<script>

	const questions = [

	{
	q:"Кое ти звучи по-интересно?",
	a:"Да разбера как работят компютърните програми.",
	b:"Да измисля как да продам нов продукт."
	},

	{
	q:"По време на проект предпочиташ да:",
	a:"Разработиш приложение или сайт.",
	b:"Направиш бизнес план."
	},

	{
	q:"Кой предмет ти е по-близък?",
	a:"Математика и информатика.",
	b:"Икономика и обществени науки."
	},

	{
	q:"Какво би избрал за свободното време?",
	a:"Да науча нова технология.",
	b:"Да организирам събитие."
	},

	{
	q:"Кое те мотивира повече?",
	a:"Решаването на логически задачи.",
	b:"Убеждаването на хора в добра идея."
	},

	{
	q:"В екип обикновено:",
	a:"Търся техническото решение.",
	b:"Координирам хората."
	},

	{
	q:"Коя новина би прочел с интерес?",
	a:"За достиженията на изкуствения интелект.",
	b:"За успешен млад предприемач."
	},

	{
	q:"Имаш идея за мобилно приложение. Първо ще:",
	a:"Помисля как да го разработя.",
	b:"Проверя дали има пазар."
	}

	];

	let current = 0;
	let techScore = 0;

	const questionEl = document.getElementById("question");
	const aBtn = document.getElementById("aBtn");
	const bBtn = document.getElementById("bBtn");
	const bar = document.getElementById("bar");

	function showQuestion(){

	let q = questions[current];

	questionEl.textContent = q.q;
	aBtn.textContent = q.a;
	bBtn.textContent = q.b;

	bar.style.width =
	(current / questions.length) * 100 + "%";
	}

	function answer(type){

	if(type === "tech")
		techScore++;

	current++;

	if(current < questions.length){
		showQuestion();
	}
	else{
		showResult();
	}
	}

	function showResult(){

	document.getElementById("quiz").style.display = "none";
	document.getElementById("result").style.display = "block";

	let techPercent =
	Math.round((techScore / questions.length) * 100);

	let bizPercent = 100 - techPercent;

	let profileName = "";
	let description = "";
	let badge = "";

	if(techPercent > bizPercent){

	profileName = "Софтуерни и хардуерни науки";
	badge = "💻";

	description =
	"Обичаш технологиите, логическите задачи, програмирането и работата с компютърни системи.";

	}
	else if(bizPercent > techPercent){

	profileName = "Предприемачески профил";
	badge = "💼";

	description =
	"Интересуваш се от бизнес идеи, управление на проекти, маркетинг и работа с хора.";

	}
	else{

	profileName = "Комбиниран профил";
	badge = "🚀";

	description =
	"Имаш интерес както към технологиите, така и към предприемачеството.";
	}

	document.getElementById("badge").textContent = badge;
	document.getElementById("profileName").textContent = profileName;

	document.getElementById("percent").innerHTML =
	`${techPercent}% Техническа насоченост<br>
	${bizPercent}% Предприемаческа насоченост`;

	document.getElementById("description").textContent =
	description;
	}

	aBtn.onclick = () => answer("tech");
	bBtn.onclick = () => answer("biz");

	showQuestion();

	</script>

</body>
</html>
